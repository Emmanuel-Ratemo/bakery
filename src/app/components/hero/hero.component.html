<section class="hero" id="top" aria-label="Bee's Blossom Bakes">
  <div class="hero__media" aria-hidden="true">
    <img
      src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=2000&q=80"
      alt=""
    />
    <div class="hero__wash"></div>
  </div>

  <div class="hero__content">
    <img class="hero__logo" src="logo.png" alt="Bee's Blossom Bakes — Blooming delights in every bite" />
    <p class="hero__tagline">Custom cakes by flavour and size · order on WhatsApp</p>
    <div class="hero__actions">
      <button type="button" class="btn btn--solid" (click)="goTo('products')">
        Shop Now
      </button>
      <button type="button" class="btn btn--outline" (click)="goMenu()">
        Full Menu
      </button>
    </div>
  </div>
</section>
