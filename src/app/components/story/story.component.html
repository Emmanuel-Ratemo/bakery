<section class="visit" id="visit">
  <div class="visit__inner">
    <p class="visit__eyebrow">Contact Us</p>
    <h2>Order fresh. Pick up warm.</h2>
    <p class="visit__lede">
      Add treats to your cart, then send your order on WhatsApp — we'll confirm pickup or delivery.
    </p>
    <div class="visit__details">
      <div>
        <h3>Hours</h3>
        <p>Mon–Sat · 8am – 6pm</p>
      </div>
      <div>
        <h3>Location</h3>
        <p>Nairobi · Bakery counter pickup</p>
      </div>
      <div>
        <h3>WhatsApp</h3>
        <p>
          <a class="visit__link" [href]="social.whatsapp.url" target="_blank" rel="noopener noreferrer">
            {{ social.whatsapp.label }}
          </a>
        </p>
      </div>
    </div>

    <nav class="visit__social" aria-label="Follow us">
      <a
        class="visit__social-link"
        [href]="social.instagram.url"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>
      <a
        class="visit__social-link"
        [href]="social.tiktok.url"
        target="_blank"
        rel="noopener noreferrer"
      >
        TikTok
      </a>
      <a
        class="visit__social-link"
        [href]="social.whatsapp.url"
        target="_blank"
        rel="noopener noreferrer"
      >
        WhatsApp
      </a>
    </nav>
  </div>
</section>
