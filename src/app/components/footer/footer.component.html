<footer class="footer">
  <div class="footer__brand-block">
    <p class="footer__brand">Bee's Blossom Bakes</p>
    <p class="footer__copy">© {{ year }} · Blooming delights in every bite</p>
  </div>

  <nav class="footer__social" aria-label="Social media">
    <a
      class="footer__social-link"
      [href]="social.instagram.url"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="footer__social-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
        </svg>
      </span>
      <span>Instagram</span>
    </a>
    <a
      class="footer__social-link"
      [href]="social.tiktok.url"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="footer__social-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M14.5 3c.4 2.4 1.9 4 4.3 4.3v2.7c-1.5 0-2.9-.5-4.1-1.3v6.2c0 3.4-2.7 6.1-6.1 6.1S2.5 18.3 2.5 14.9 5.2 8.8 8.6 8.8c.3 0 .7 0 1 .1v2.8c-.3-.1-.6-.1-1-.1-1.8 0-3.3 1.5-3.3 3.3s1.5 3.3 3.3 3.3 3.3-1.5 3.3-3.3V3h2.6Z" />
        </svg>
      </span>
      <span>TikTok</span>
    </a>
    <a
      class="footer__social-link"
      [href]="social.whatsapp.url"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="footer__social-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12.04 2C6.58 2 2.15 6.4 2.15 11.83c0 1.99.58 3.85 1.6 5.44L2 22l4.88-1.63a9.9 9.9 0 0 0 5.16 1.44h.01c5.46 0 9.89-4.4 9.89-9.83C21.94 6.4 17.5 2 12.04 2Zm5.5 13.98c-.23.64-1.33 1.17-1.85 1.24-.47.07-1.07.1-1.73-.11-.4-.12-.91-.28-1.57-.55-2.76-1.19-4.55-3.97-4.69-4.15-.14-.18-1.15-1.53-1.15-2.92 0-1.39.73-2.07.99-2.35.26-.28.57-.35.76-.35h.55c.17 0 .41-.07.64.49.23.57.79 1.97.86 2.11.07.14.12.3.02.49-.1.18-.14.3-.28.46-.14.16-.3.36-.42.48-.14.14-.28.29-.12.57.16.28.7 1.15 1.5 1.86 1.03.92 1.9 1.21 2.17 1.35.28.14.43.12.59-.07.16-.18.69-.8.87-1.08.18-.28.37-.23.62-.14.26.1 1.63.77 1.91.91.28.14.47.21.54.32.07.12.07.68-.16 1.32Z" />
        </svg>
      </span>
      <span>{{ social.whatsapp.label }}</span>
    </a>
  </nav>
</footer>
