name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate admin credentials
        env:
          ADMIN_PASSWORD_SECRET: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PASSWORD_VAR: ${{ vars.ADMIN_PASSWORD }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ADMIN_GITHUB_OWNER: ${{ github.repository_owner }}
          ADMIN_GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          ADMIN_PASSWORD="${ADMIN_PASSWORD_SECRET:-$ADMIN_PASSWORD_VAR}"
          export ADMIN_PASSWORD
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::ADMIN_PASSWORD is empty or missing."
            echo "Add it as a Repository or github-pages Environment secret named ADMIN_PASSWORD."
            exit 1
          fi
          if [ -z "$ADMIN_GITHUB_TOKEN" ]; then
            echo "::warning::ADMIN_GITHUB_TOKEN is empty. Live Admin image uploads will stay browser-only."
            echo "Add a fine-grained PAT (Contents: Read and write) as Environment secret ADMIN_GITHUB_TOKEN on github-pages."
          else
            echo "ADMIN_GITHUB_TOKEN is set (length ${#ADMIN_GITHUB_TOKEN})."
          fi
          echo "ADMIN_PASSWORD is set (length ${#ADMIN_PASSWORD})."
          node scripts/generate-admin-credentials.mjs --require

      - name: Build
        run: npx ng build --configuration=production --base-href=/${{ github.event.repository.name }}/

      - name: Add .nojekyll
        run: touch dist/brees-bakery/browser/.nojekyll

      - name: SPA fallback for /admin routes
        run: cp dist/brees-bakery/browser/index.html dist/brees-bakery/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/brees-bakery/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
