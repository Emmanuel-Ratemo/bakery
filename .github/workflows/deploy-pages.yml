name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate admin credentials
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::ADMIN_PASSWORD secret is empty or missing."
            echo "Add a Repository secret named exactly ADMIN_PASSWORD:"
            echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Do not use an Environment secret unless this job also uses that environment."
            exit 1
          fi
          echo "ADMIN_PASSWORD secret is set (length ${#ADMIN_PASSWORD})."
          node scripts/generate-admin-credentials.mjs --require

      - name: Build
        run: npx ng build --configuration=production --base-href=/${{ github.event.repository.name }}/

      - name: Add .nojekyll
        run: touch dist/brees-bakery/browser/.nojekyll

      - name: SPA fallback for /admin routes
        run: cp dist/brees-bakery/browser/index.html dist/brees-bakery/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/brees-bakery/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
